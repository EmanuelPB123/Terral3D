<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fijar objetos en AR.js</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>
    <style>
      #fijarBtn {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        font-size: 16px;
        background-color: #ff9800;
        color: white;
        border: none;
        border-radius: 8px;
        z-index: 10;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden">
    <button id="fijarBtn">Fijar Objetos</button>

    <a-scene embedded arjs="sourceType: webcam;">
      <!-- Marcador -->
      <a-marker id="marker" type="pattern" url="zona1.patt">
        <a-box position="0 0.5 0" color="red" depth="0.3" height="0.3" width="0.3"></a-box>
        <a-sphere position="0 1 0" radius="0.2" color="blue"></a-sphere>
      </a-marker>

      <!-- Cámara -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const btn = document.getElementById("fijarBtn");
      btn.addEventListener("click", () => {
        const marker = document.querySelector("#marker");
        const scene = document.querySelector("a-scene");

        // Clonamos los hijos del marcador
        marker.childNodes.forEach((child) => {
          if (child.tagName && child.tagName.startsWith("A-")) {
            const clone = child.cloneNode(true);
            // Convertir la posición del objeto al espacio del mundo (fuera del marcador)
            const worldPos = new THREE.Vector3();
            child.object3D.getWorldPosition(worldPos);

            const worldRot = new THREE.Euler();
            child.object3D.getWorldRotation(worldRot);

            // Asignar posición y rotación en la escena
            clone.setAttribute("position", `${worldPos.x} ${worldPos.y} ${worldPos.z}`);
            clone.setAttribute("rotation", {
              x: THREE.Math.radToDeg(worldRot.x),
              y: THREE.Math.radToDeg(worldRot.y),
              z: THREE.Math.radToDeg(worldRot.z),
            });

            // Agregarlo directamente a la escena
            scene.appendChild(clone);
          }
        });
      });
    </script>
  </body>
</html>
