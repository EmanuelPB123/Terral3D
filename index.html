<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Fijar Escena</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/ar.js/1.7.2/aframe/build/aframe-ar.js"></script>
    <style>
      #statusIndicator {
        position: absolute;
        top: 10px;
        left: 10px;
        background-color: white;
        padding: 8px;
        font-family: sans-serif;
        border-radius: 5px;
        z-index: 100;
      }

      #fixSceneButton {
        position: absolute;
        top: 50px;
        left: 10px;
        padding: 10px 15px;
        font-size: 14px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        z-index: 100;
      }

      #fixSceneButton:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- Indicador -->
    <div id="statusIndicator">Buscando marcador...</div>
    <button id="fixSceneButton">Fijar Escena</button>

    <!-- Escena AR -->
    <a-scene embedded arjs="sourceType: webcam;">
      <a-marker id="miMarcador" type="pattern" url="patt.patt">
        <a-entity id="contenidoMarcador">
          <!-- Lo que aparece sobre el marcador -->
          <a-box position="0 0.5 0" material="color: red;"></a-box>
          <a-sphere position="1 0.5 0" material="color: blue;"></a-sphere>
          <a-cylinder position="-1 0.5 0" material="color: green;"></a-cylinder>
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <!-- Script para manejar la fijación -->
    <script>
      const status = document.getElementById('statusIndicator');
      const fixButton = document.getElementById('fixSceneButton');
      const marker = document.getElementById('miMarcador');
      let fixed = false;

      marker.addEventListener('markerFound', () => {
        if (!fixed) status.innerText = 'Marcador detectado';
      });

      fixButton.addEventListener('click', () => {
        if (fixed) return;

        const markerContent = document.getElementById('contenidoMarcador');
        const clone = markerContent.cloneNode(true);

        // Obtener posición y rotación del marcador
        const position = marker.object3D.position.clone();
        const rotation = marker.object3D.rotation.clone();

        // Asignar posición y rotación al clon
        clone.setAttribute('position', `${position.x} ${position.y} ${position.z}`);
        clone.setAttribute('rotation', `${THREE.Math.radToDeg(rotation.x)} ${THREE.Math.radToDeg(rotation.y)} ${THREE.Math.radToDeg(rotation.z)}`);

        // Agregar a la escena
        document.querySelector('a-scene').appendChild(clone);

        // Ocultar el marcador si querés
        marker.setAttribute('visible', 'false');

        fixed = true;
        status.innerText = 'Escena fijada';
      });
    </script>
  </body>
</html>
